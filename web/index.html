<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>melon benchmarks</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --muted:       #898781;
    --grid:        #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11, 11, 11, 0.10);
    --accent:      #2a78d6;
    --decal-ink:   rgba(11, 11, 11, 0.28);
  }
  /* ?theme=light|dark (mirrored to data-theme before first paint) must beat
     the media query in both directions, so the dark palette appears twice:
     once OS-driven unless overridden to light, once forced by the override. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface:   #1a1a19;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #898781;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255, 255, 255, 0.10);
      --accent:    #3987e5;
      --decal-ink: rgba(255, 255, 255, 0.30);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255, 255, 255, 0.10);
    --accent:    #3987e5;
    --decal-ink: rgba(255, 255, 255, 0.30);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 24px 48px; }

  header h1 { font-size: 22px; font-weight: 600; margin: 6px 0 2px; }
  header p  { margin: 0 0 18px; color: var(--ink-2); }

  /* ---- filter rows ---- */
  .filters {
    display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end;
    margin-bottom: 12px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.push { margin-left: auto; }
  .field > label { font-size: 13px; color: var(--muted); }
  .dd-btn, .seg {
    height: 32px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink); font: inherit;
  }
  .dd-btn:focus-visible, .seg button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  /* dropdown with checkboxes */
  .dd { position: relative; }
  .dd-btn { padding: 0 30px 0 10px; cursor: pointer; text-align: left; min-width: 150px; position: relative; }
  .dd-btn::after {
    content: ""; position: absolute; right: 11px; top: 13px;
    border: 4px solid transparent; border-top-color: var(--muted);
  }
  .dd-panel {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 30;
    min-width: 250px; max-height: 380px; overflow: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); padding: 6px;
  }
  .dd-panel[hidden] { display: none; }
  .dd-panel label {
    display: flex; gap: 8px; align-items: center; padding: 5px 8px;
    border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .dd-panel label:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .dd-panel input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  .fam-head {
    display: flex; align-items: baseline; gap: 8px; padding: 8px 8px 2px;
    border-top: 1px solid var(--grid); margin-top: 4px;
  }
  .fam-head:first-child { border-top: 0; margin-top: 0; }
  .fam-head b { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); }
  .fam-head button {
    border: 0; background: none; color: var(--accent); font-size: 13px;
    cursor: pointer; padding: 0;
  }
  .fam-avg { font-style: italic; }

  /* segmented control */
  .seg { display: inline-flex; padding: 2px; gap: 2px; }
  .seg button {
    border: 0; border-radius: 6px; background: none; color: var(--ink-2);
    font: inherit; font-size: 14px; padding: 0 10px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--ink); }

  /* ---- cards, one per (algorithm, variant) ---- */
  #cards { display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px 8px;
  }
  .card h2 { font-size: 17px; font-weight: 600; margin: 2px 0 0; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 1px 0 6px; }
  .card .chart { width: 100%; }
  .msg { padding: 48px 12px; text-align: center; color: var(--ink-2); }
  .msg code { background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 1px 5px; border-radius: 4px; }

  /* ---- table view ---- */
  .tbl h3 { font-size: 14px; font-weight: 600; margin: 14px 2px 6px; color: var(--ink-2); }
  .tblwrap { overflow-x: auto; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 100%; }
  th, td { padding: 5px 10px; text-align: right; white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--baseline); }
  th:first-child, td:first-child { text-align: left; }
  tbody tr { border-bottom: 1px solid var(--grid); }
  tbody tr:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  td .sd { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }

  footer { margin-top: 10px; color: var(--muted); font-size: 13px; }
</style>
<script>
  {
    const theme = new URLSearchParams(location.search).get("theme");
    if (theme === "light" || theme === "dark")
      document.documentElement.dataset.theme = theme;
  }
</script>
</head>
<body>
<main>
  <div id="filters" hidden>
    <div class="filters" id="facet-slot"></div>
    <div class="filters" id="main-row">
      <div class="field push" id="scale-field">
        <label>Scale</label>
        <div class="seg" id="scale-seg"></div>
      </div>
      <div class="field">
        <label>View</label>
        <div class="seg" id="view-seg"></div>
      </div>
    </div>
  </div>

  <section class="card" id="empty-card" hidden>
    <div id="empty" class="msg"></div>
  </section>
  <div id="cards"></div>
  <footer id="foot"></footer>
</main>

<script src="echarts.min.js"></script>
<script>
"use strict";

/* Validated categorical palette (dataviz reference instance): fixed slot
   order in both modes — the order is the CVD-safety mechanism. Three light
   slots sit below 3:1 on the surface; the table view is the relief channel. */
const PALETTE = {
  light: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"],
  dark:  ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"],
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const natural = new Intl.Collator("en", { numeric: true, sensitivity: "base" });
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const darkMode = matchMedia("(prefers-color-scheme: dark)");
const themeMode = () =>
  document.documentElement.dataset.theme || (darkMode.matches ? "dark" : "light");
/* Registered before boot()'s fetch resolves: an embedding page sends its
   theme on iframe load, which does not wait for data.json. */
addEventListener("message", (e) => {
  const theme = e.data && e.data.theme;
  if (theme === "light" || theme === "dark")
    document.documentElement.dataset.theme = theme;
  else if (theme === "auto") delete document.documentElement.dataset.theme;
  else return;
  if (DATA) update();
});
/* Height reporting for an embedding page: load and update() cover the
   app-driven changes deterministically; the ResizeObserver catches pure
   layout changes no app hook sees (the filter row rewrapping on a width
   change). */
const reportHeight = () => {
  if (window.parent === window) return;
  parent.postMessage({ height: document.documentElement.offsetHeight }, "*");
};
new ResizeObserver(reportHeight).observe(document.documentElement);
addEventListener("load", reportHeight);

let DATA = null;
let FACETS = [];             // [{key, label, of(runId) -> value, values}]
let byAlgo = new Map();      // algo -> params -> rows
let dsInstances = new Map(); // dataset -> Set(instance), across all algorithms
let charts = [];             // live ECharts instances, one per rendered card
const dropdowns = [];        // checkDropdown fields, for refreshing button texts

const state = {
  facet: new Map(),     // facet key -> Set of selected values
  algos: new Set(),     // selected algorithms
  variants: new Map(),  // algo -> Set of selected params (lazy default: first)
  inst: new Map(),      // dataset -> {picked: Set(instance), avg: bool}
  legendSel: new Map(), // combo key -> {series name: false when toggled off}
  scale: "auto",        // auto | linear | log
  view: "chart",        // chart | table
};

/* ---------- data plumbing ---------- */

function facetsOf(runId) { return DATA.runs[runId].facets || {}; }

function buildFacetDefs() {
  const known = new Set(["hardware", "compiler", "options"]);
  const extra = new Set();
  for (const id of Object.keys(DATA.runs))
    for (const k of Object.keys(facetsOf(id))) if (!known.has(k)) extra.add(k);
  FACETS = [
    { key: "hardware", label: "Hardware", of: (id) => facetsOf(id).hardware || "unknown" },
    { key: "build", label: "Compiler + options",
      of: (id) => [facetsOf(id).compiler, facetsOf(id).options].filter(Boolean).join(" ") || "unknown" },
    ...[...extra].sort().map((k) => ({
      key: k, label: k[0].toUpperCase() + k.slice(1), of: (id) => String(facetsOf(id)[k]),
    })),
  ];
}

function indexRows() {
  for (const row of DATA.rows) {
    const [, algo, params, dataset, , instance] = row;
    if (!byAlgo.has(algo)) byAlgo.set(algo, new Map());
    const perParams = byAlgo.get(algo);
    if (!perParams.has(params)) perParams.set(params, []);
    perParams.get(params).push(row);
    if (!dsInstances.has(dataset)) dsInstances.set(dataset, new Set());
    dsInstances.get(dataset).add(instance);
  }
}

function selectedRuns() {
  return Object.keys(DATA.runs)
    .filter((id) => FACETS.every((d) => state.facet.get(d.key).has(d.of(id))))
    .sort((a, b) => natural.compare(runLabel(a), runLabel(b)));
}

function runLabel(id) { return FACETS.map((d) => d.of(id)).join(" · "); }

const allAlgos = () => [...byAlgo.keys()].sort(natural.compare);
const variantsOf = (algo) => [...byAlgo.get(algo).keys()].sort(natural.compare);

function variantState(algo) {
  if (!state.variants.has(algo))
    state.variants.set(algo, new Set([variantsOf(algo)[0]]));
  return state.variants.get(algo);
}

/* The charts to draw: one per selected (algorithm, variant), in stable order. */
function selectedCombos() {
  const combos = [];
  for (const algo of allAlgos()) {
    if (!state.algos.has(algo)) continue;
    const sel = variantState(algo);
    for (const params of variantsOf(algo))
      if (sel.has(params)) combos.push({ algo, params });
  }
  return combos;
}

function comboRows(combo) { return byAlgo.get(combo.algo).get(combo.params) || []; }

function legendSelOf(combo) {
  const key = combo.algo + "␀" + combo.params;
  if (!state.legendSel.has(key)) state.legendSel.set(key, {});
  return state.legendSel.get(key);
}

/* Datasets and instances available across the given combos. */
function availableInstances(combos) {
  const ds = new Map();
  for (const combo of combos)
    for (const r of comboRows(combo)) {
      if (!ds.has(r[3])) ds.set(r[3], new Set());
      ds.get(r[3]).add(r[5]);
    }
  return new Map([...ds.entries()].sort((a, b) => natural.compare(a[0], b[0])));
}

function instState(dataset) {
  if (!state.inst.has(dataset))
    state.inst.set(dataset, { picked: new Set(dsInstances.get(dataset)), avg: false });
  return state.inst.get(dataset);
}

/* ---------- assembling one card's slice ---------- */

function assemble(combo) {
  let runs = selectedRuns();
  const avail = availableInstances([combo]);

  const ticks = []; // {dataset, instance|null, label}
  for (const [dataset, insts] of avail) {
    const st = instState(dataset);
    for (const inst of [...insts].sort(natural.compare))
      if (st.picked.has(inst)) ticks.push({ dataset, instance: inst, label: inst });
    if (st.avg) ticks.push({ dataset, instance: null, label: dataset + " (mean)" });
  }

  // value lookup and per-family accumulation for the mean ticks
  const val = new Map(); // run\0series\0dataset\0instance -> {v, sd}
  const fam = new Map(); // run\0series\0dataset -> [v, ...]
  const seriesSet = new Set();
  const runSet = new Set(runs);
  for (const [run, , , dataset, series, instance, v, sd] of comboRows(combo)) {
    if (!runSet.has(run)) continue;
    seriesSet.add(series);
    val.set([run, series, dataset, instance].join("\0"), { v, sd });
    const fk = [run, series, dataset].join("\0");
    if (!fam.has(fk)) fam.set(fk, []);
    fam.get(fk).push(v);
  }

  const names = [...seriesSet].sort(natural.compare);
  let cells = runs.map((run) => names.map((series) => ticks.map((t) => {
    if (t.instance !== null)
      return val.get([run, series, t.dataset, t.instance].join("\0")) || null;
    const vs = fam.get([run, series, t.dataset].join("\0"));
    if (!vs || !vs.length) return null;
    return { v: vs.reduce((a, b) => a + b, 0) / vs.length, sd: null, n: vs.length };
  })));

  // a run with no data for this combo would render as an empty grid — drop it
  const runKeep = runs.map((_, gi) => cells[gi].some((arr) => arr.some(Boolean)));
  runs = runs.filter((_, i) => runKeep[i]);
  cells = cells.filter((_, i) => runKeep[i]);

  // drop series that have no visible value in any selected run
  const keep = names.map((_, si) => cells.some((perRun) => perRun[si].some(Boolean)));
  return {
    runs, ticks,
    names: names.filter((_, i) => keep[i]),
    cells: cells.map((perRun) => perRun.filter((_, i) => keep[i])),
  };
}

/* Color follows the series name (fixed sorted order). Past 8 series, fold to
   composite encoding: hue = the series' base structure, decal = its variant
   suffix — never a 9th generated hue. */
function colorPlan(names) {
  const C = PALETTE[themeMode()];
  if (names.length <= C.length)
    return new Map(names.map((n, i) => [n, { color: C[i], decal: 0 }]));

  const split = (n) => {
    const i = n.lastIndexOf(":");
    return i > 0 && n[i - 1] !== ":" ? [n.slice(0, i), n.slice(i + 1)] : [n, ""];
  };
  const bases = [...new Set(names.map((n) => split(n)[0]))].sort(natural.compare);
  const variants = [...new Set(names.map((n) => split(n)[1]))].sort(natural.compare);
  if (bases.length <= C.length)
    return new Map(names.map((n) => {
      const [b, v] = split(n);
      return [n, { color: C[bases.indexOf(b)], decal: variants.indexOf(v) }];
    }));
  return new Map(names.map((n, i) => [n, { color: C[i % C.length], decal: Math.floor(i / C.length) }]));
}

function decalOf(k) {
  if (!k) return null;
  const base = { color: cssVar("--decal-ink"), symbol: "rect", symbolSize: 1, dashArrayX: [1, 0] };
  if (k === 1) return { ...base, dashArrayY: [2, 4], rotation: Math.PI / 4 };
  if (k === 2) return { ...base, dashArrayY: [2, 4], rotation: -Math.PI / 4 };
  return { ...base, symbol: "circle", symbolSize: 0.7, dashArrayX: [6, 6], dashArrayY: [6, 6] };
}

/* ---------- formatting ---------- */

function fmtMs(v) {
  if (v == null || !isFinite(v)) return "–";
  if (v >= 1000) return v.toLocaleString("en-US", { maximumFractionDigits: 0 });
  if (v >= 100) return v.toFixed(0);
  if (v >= 10) return v.toFixed(1);
  if (v >= 1) return v.toFixed(2);
  return v.toPrecision(3);
}

function variantLabel(p) { return p === "" ? "default" : p.split("|").join(" | "); }

/* ---------- chart ---------- */

const BAND_H = 310, LEGEND_H = 38;

function renderChart(card, slice, legendSel) {
  const { runs, ticks, names, cells } = slice;
  const plan = colorPlan(names);
  const multi = runs.length > 1;

  // The whole option is a function of the legend selection: the axis range
  // (and the auto log/linear choice) follow only the series left visible.
  const buildOption = () => {
  const shown = (si) => legendSel[names[si]] !== false;
  const flat = [];
  cells.forEach((perRun) => perRun.forEach((arr, si) => {
    if (!shown(si)) return;
    arr.forEach((c) => { if (c && c.v > 0) flat.push(c.v); });
  }));
  const ratio = flat.length ? Math.max(...flat) / Math.min(...flat) : 1;
  const useLog = state.scale === "log" || (state.scale === "auto" && ratio > 50);
  const yMax = flat.length ? Math.max(...flat) : 1;
  const yMin = flat.length ? Math.min(...flat) : 0.1;

  /* ECharts baselines log-axis bars at y=1, so sub-unit values hang downward.
     Instead plot log10(v) shifted to the decade floor on a linear axis, with
     power-of-ten tick labels — bars then grow from the axis floor as expected. */
  const kMin = Math.floor(Math.log10(yMin));
  const kMax = Math.ceil(Math.log10(yMax));
  const toPlot = (v) => (useLog ? Math.log10(v) - kMin : v);
  // Shared across all run grids, so runs stay comparable at a glance.
  const decade = Math.pow(10, Math.floor(Math.log10(yMax)));
  const linMax = Math.ceil((yMax / decade) * 2) / 2 * decade;

  const grids = [], xAxes = [], yAxes = [], titles = [], series = [];
  runs.forEach((run, gi) => {
    const top = LEGEND_H + gi * BAND_H;
    if (multi) titles.push({
      text: runLabel(run), left: 4, top: top + 2,
      textStyle: { fontSize: 13, fontWeight: 600, color: cssVar("--ink-2") },
    });
    grids.push({ left: 64, right: 16, top: top + (multi ? 44 : 26), height: BAND_H - (multi ? 130 : 112) });
    xAxes.push({
      gridIndex: gi, type: "category", data: ticks.map((t) => t.label),
      axisLine: { lineStyle: { color: cssVar("--baseline") } },
      axisTick: { show: false },
      axisLabel: { color: cssVar("--muted"), rotate: ticks.length > 5 ? 28 : 0, fontSize: 12.5 },
    });
    yAxes.push({
      gridIndex: gi, type: "value",
      name: gi === 0 ? "median ms" : "",
      nameTextStyle: { color: cssVar("--muted"), align: "left", fontSize: 12.5 },
      min: 0,
      max: useLog ? kMax - kMin : linMax,
      interval: useLog ? 1 : undefined,
      axisLabel: {
        color: cssVar("--muted"), fontSize: 12.5,
        formatter: (v) => fmtMs(useLog ? Math.pow(10, v + kMin) : v),
      },
      splitLine: { lineStyle: { color: cssVar("--grid"), width: 1 } },
    });
    names.forEach((name, si) => {
      const p = plan.get(name);
      series.push({
        name, type: "bar", xAxisIndex: gi, yAxisIndex: gi,
        data: cells[gi][si].map((c) => c ? { value: toPlot(c.v), real: c.v, sd: c.sd, n: c.n } : { value: null }),
        barMaxWidth: 32, barGap: "18%", barCategoryGap: "24%",
        itemStyle: { color: p.color, borderRadius: [4, 4, 0, 0], decal: decalOf(p.decal) },
        emphasis: { itemStyle: { borderColor: cssVar("--ink"), borderWidth: 1 } },
      });
    });
  });

  return {
    animationDuration: 200,
    textStyle: { fontFamily: "system-ui, -apple-system, 'Segoe UI', sans-serif" },
    legend: names.length > 1 ? {
      type: "scroll", top: 2, left: 4, right: 4,
      itemWidth: 13, itemHeight: 13,
      selected: Object.fromEntries(names.map((n) => [n, legendSel[n] !== false])),
      textStyle: { color: cssVar("--ink-2"), fontSize: 13 },
      pageIconColor: cssVar("--ink-2"), pageTextStyle: { color: cssVar("--muted") },
    } : { show: false },
    grid: grids, xAxis: xAxes, yAxis: yAxes, title: titles, series,
    tooltip: {
      trigger: "axis",
      axisPointer: { type: "shadow" },
      backgroundColor: cssVar("--surface"),
      borderColor: cssVar("--border"),
      textStyle: { color: cssVar("--ink"), fontSize: 13 },
      formatter: (params) => {
        if (!params.length) return "";
        const gi = xAxes.length > 1 ? series[params[0].seriesIndex].xAxisIndex : 0;
        let html = `<div style="margin-bottom:4px"><b>${esc(params[0].axisValueLabel)}</b>` +
          (multi ? `<span style="color:${cssVar("--muted")}"> — ${esc(runLabel(runs[gi]))}</span>` : "") +
          `</div>`;
        const rows = params.filter((p) => p.data && p.data.real != null)
          .sort((a, b) => a.data.real - b.data.real);
        for (const p of rows) {
          const d = p.data;
          const extra = d.n ? ` <span style="color:${cssVar("--muted")}">mean of ${d.n}</span>`
            : d.sd != null ? ` <span style="color:${cssVar("--muted")}">± ${fmtMs(d.sd)}</span>` : "";
          html += `<div><span style="display:inline-block;width:12px;border-top:3px solid ${p.color};` +
            `margin:0 6px 3px 0"></span><b>${fmtMs(d.real)} ms</b>${extra}` +
            ` <span style="color:${cssVar("--ink-2")}">${esc(p.seriesName)}</span></div>`;
        }
        return html;
      },
    },
  };
  };

  const el = document.createElement("div");
  el.className = "chart";
  el.style.height = (LEGEND_H + runs.length * BAND_H + 6) + "px";
  card.appendChild(el);
  const chart = echarts.init(el, null, { renderer: "canvas" });
  charts.push(chart);
  chart.setOption(buildOption());
  chart.on("legendselectchanged", (e) => {
    Object.assign(legendSel, e.selected);
    chart.setOption(buildOption());
  });
}

/* ---------- table view (relief channel: every plotted value, no hover) ---------- */

function renderTable(card, slice) {
  const { runs, ticks, names, cells } = slice;
  const plan = colorPlan(names);
  let html = "";
  runs.forEach((run, gi) => {
    if (runs.length > 1) html += `<h3>${esc(runLabel(run))}</h3>`;
    html += `<div class="tblwrap"><table><thead><tr><th>instance</th>`;
    for (const n of names)
      html += `<th><span class="swatch" style="background:${plan.get(n).color}"></span>${esc(n)}</th>`;
    html += `</tr></thead><tbody>`;
    ticks.forEach((t, ti) => {
      html += `<tr><td>${esc(t.label)}</td>`;
      names.forEach((_, si) => {
        const c = cells[gi][si][ti];
        html += c
          ? `<td>${fmtMs(c.v)}${c.sd != null ? `<span class="sd">± ${fmtMs(c.sd)}</span>` : ""}</td>`
          : `<td>–</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
  });
  const div = document.createElement("div");
  div.className = "tbl";
  div.innerHTML = html + `<p class="sub" style="padding:8px 2px">values in milliseconds (median over repetitions ± stddev)</p>`;
  card.appendChild(div);
}

/* ---------- the one dropdown component ----------
   Every selector is a checkbox dropdown described declaratively:
     label     — the field caption
     summary() — current button text
     groups()  — [{ title?, links?: [{text, apply()}], rows: [{text, checked,
                  set(on), cls?}] }]; title-less groups render as a flat list,
                  links (all/none) re-render the open panel and update().
   The component owns the open/close/outside-click behavior; row changes go
   through checkboxRow, which calls update() after mutating state. */

function makeDropdown(btn, panel, renderBody) {
  const close = () => { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  btn.addEventListener("click", () => {
    const open = panel.hidden;
    document.querySelectorAll(".dd-panel").forEach((p) => (p.hidden = true));
    if (open) { renderBody(); panel.hidden = false; }
    btn.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", (e) => {
    // A target detached mid-click (a link re-rendered the panel) is not an
    // outside click, even though it is no longer contained anywhere.
    if (!e.target.isConnected) return;
    if (!btn.parentElement.contains(e.target)) close();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
}

function checkboxRow(labelText, checked, onChange, cls) {
  const label = document.createElement("label");
  if (cls) label.className = cls;
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = checked;
  cb.addEventListener("change", () => { onChange(cb.checked); update(); });
  label.appendChild(cb);
  label.appendChild(document.createTextNode(labelText));
  return label;
}

function checkDropdown(spec) {
  const field = document.createElement("div");
  field.className = "field dd";
  const lab = document.createElement("label");
  lab.textContent = spec.label;
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "dd-btn"; btn.setAttribute("aria-haspopup", "true");
  const panel = document.createElement("div");
  panel.className = "dd-panel"; panel.hidden = true;
  field.append(lab, btn, panel);

  const renderPanel = () => {
    panel.textContent = "";
    for (const g of spec.groups()) {
      if (g.title !== undefined) {
        const head = document.createElement("div");
        head.className = "fam-head";
        const b = document.createElement("b");
        b.textContent = g.title;
        head.appendChild(b);
        for (const link of g.links || []) {
          const a = document.createElement("button");
          a.type = "button"; a.textContent = link.text;
          a.addEventListener("click", () => { link.apply(); renderPanel(); update(); });
          head.appendChild(a);
        }
        panel.appendChild(head);
      }
      for (const row of g.rows)
        panel.appendChild(checkboxRow(row.text, row.checked, row.set, row.cls));
    }
  };
  makeDropdown(btn, panel, renderPanel);
  field.refresh = () => { btn.textContent = spec.summary(); };
  field.refresh();
  dropdowns.push(field);
  return field;
}

/* ---------- the five selectors, declared against checkDropdown ---------- */

function setToggler(set) {
  return (value) => (on) => { on ? set.add(value) : set.delete(value); };
}

function buildControls() {
  for (const def of FACETS) {
    const values = [...new Set(Object.keys(DATA.runs).map((id) => def.of(id)))].sort(natural.compare);
    def.values = values;
    state.facet.set(def.key, new Set(values));
    $("facet-slot").appendChild(checkDropdown({
      label: def.label,
      summary: () => {
        const sel = state.facet.get(def.key);
        return sel.size === values.length ? `All (${values.length})`
          : sel.size === 1 ? [...sel][0] : `${sel.size} of ${values.length}`;
      },
      groups: () => {
        const toggle = setToggler(state.facet.get(def.key));
        return [{ rows: values.map((v) => ({
          text: v, checked: state.facet.get(def.key).has(v), set: toggle(v),
        })) }];
      },
    }));
  }

  const mainRow = $("main-row"), anchor = $("scale-field");

  state.algos = new Set([allAlgos()[0]]);
  mainRow.insertBefore(checkDropdown({
    label: "Algorithms",
    summary: () => state.algos.size === 1 ? [...state.algos][0]
      : `${state.algos.size} of ${allAlgos().length}`,
    groups: () => {
      const toggle = setToggler(state.algos);
      return [{ rows: allAlgos().map((a) => ({
        text: a, checked: state.algos.has(a), set: toggle(a),
      })) }];
    },
  }), anchor);

  // Variants grouped by algorithm, mirroring instances-by-family; algorithms
  // with a single variant have nothing to choose and get no group.
  const multiVariantAlgos = () =>
    allAlgos().filter((a) => state.algos.has(a) && variantsOf(a).length > 1);
  const variantField = checkDropdown({
    label: "Variants",
    summary: () => {
      const algos = multiVariantAlgos();
      const total = algos.reduce((s, a) => s + variantsOf(a).length, 0);
      const sel = algos.reduce((s, a) => s + variantState(a).size, 0);
      return sel === total ? `All (${total})` : `${sel} of ${total}`;
    },
    groups: () => multiVariantAlgos().map((algo) => {
      const sel = variantState(algo);
      return {
        title: algo,
        links: [
          { text: "all", apply: () => variantsOf(algo).forEach((p) => sel.add(p)) },
          { text: "none", apply: () => sel.clear() },
        ],
        rows: variantsOf(algo).map((p) => ({
          text: variantLabel(p), checked: sel.has(p), set: setToggler(sel)(p),
        })),
      };
    }),
  });
  variantField.id = "variant-field";
  mainRow.insertBefore(variantField, anchor);

  mainRow.insertBefore(checkDropdown({
    label: "Instances",
    summary: () => {
      let picked = 0, total = 0, avgs = 0;
      for (const [ds, insts] of availableInstances(selectedCombos())) {
        const st = instState(ds);
        total += insts.size;
        picked += [...insts].filter((i) => st.picked.has(i)).length;
        if (st.avg) avgs++;
      }
      return (picked === total ? `All instances (${total})` : `${picked} of ${total} instances`) +
        (avgs ? ` + ${avgs} mean` : "");
    },
    groups: () => [...availableInstances(selectedCombos())].map(([ds, insts]) => {
      const st = instState(ds);
      return {
        title: ds,
        links: [
          { text: "all", apply: () => { st.picked = new Set(insts); } },
          { text: "none", apply: () => { st.picked = new Set(); } },
        ],
        rows: [
          { text: `mean over ${ds}`, cls: "fam-avg", checked: st.avg,
            set: (on) => { st.avg = on; } },
          ...[...insts].sort(natural.compare).map((i) => ({
            text: i, checked: instState(ds).picked.has(i), set: (on) => {
              on ? instState(ds).picked.add(i) : instState(ds).picked.delete(i);
            },
          })),
        ],
      };
    }),
  }), anchor);
}

function buildSegs() {
  const seg = (el, options, get, set) => {
    for (const [value, text] of options) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = text;
      b.addEventListener("click", () => { set(value); update(); });
      el.appendChild(b);
    }
    el.refresh = () => [...el.children].forEach((b, i) =>
      b.setAttribute("aria-pressed", String(options[i][0] === get())));
    el.refresh();
  };
  seg($("scale-seg"), [["auto", "Auto"], ["linear", "Linear"], ["log", "Log"]],
    () => state.scale, (v) => (state.scale = v));
  seg($("view-seg"), [["chart", "Chart"], ["table", "Table"]],
    () => state.view, (v) => (state.view = v));
}

/* ---------- URL state ----------
   Selectors mirror into the query string so a link (or an <iframe> on a docs
   page) reproduces the view: ?algorithm=a1,a2&variant.<algo>=p1,p2
   &dataset=9th_dimacs&hardware=...&build=...&inst.<ds>=i1,i2,mean
   &scale=log&view=table. `params=X` is the legacy single-variant spelling and
   is still read. Only non-default values are written.
   ?theme=light|dark overrides prefers-color-scheme (applied in <head>);
   an embedding page can also postMessage({theme}) to switch without a
   reload, and receives {height} messages to size its iframe with. */

function applyUrlState() {
  const q = new URLSearchParams(location.search);

  const algoRaw = q.get("algorithm");
  if (algoRaw) {
    const want = algoRaw.split(",").filter((a) => byAlgo.has(a));
    if (want.length) state.algos = new Set(want);
  }
  const legacy = q.get("params");
  for (const algo of state.algos) {
    const raw = q.get("variant." + algo);
    if (raw !== null) {
      const tokens = raw.split(",");
      state.variants.set(algo, tokens.includes("all") ? new Set(variantsOf(algo))
        : new Set(tokens.filter((t) => byAlgo.get(algo).has(t))));
    } else if (legacy !== null && byAlgo.get(algo).has(legacy)) {
      state.variants.set(algo, new Set([legacy]));
    }
  }

  for (const def of FACETS) {
    const raw = q.get(def.key);
    if (!raw) continue;
    const want = raw.split(",").filter((v) => def.values.includes(v));
    if (want.length) state.facet.set(def.key, new Set(want));
  }

  const avail = availableInstances(selectedCombos());
  const ds = q.get("dataset");
  if (ds !== null) {
    const want = new Set(ds.split(","));
    for (const [dataset, insts] of avail) {
      const st = instState(dataset);
      st.picked = want.has(dataset) ? new Set(insts) : new Set();
      st.avg = false;
    }
  }
  for (const [dataset, insts] of avail) {
    const raw = q.get("inst." + dataset);
    if (raw === null) continue;
    const tokens = raw.split(",");
    const st = instState(dataset);
    st.avg = tokens.includes("mean");
    st.picked = tokens.includes("all") ? new Set(insts)
      : new Set(tokens.filter((t) => insts.has(t)));
  }

  const scale = q.get("scale");
  if (["auto", "linear", "log"].includes(scale)) state.scale = scale;
  const view = q.get("view");
  if (["chart", "table"].includes(view)) state.view = view;
}

function syncUrl() {
  const q = new URLSearchParams();
  q.set("algorithm", [...state.algos].sort(natural.compare).join(","));

  for (const algo of allAlgos()) {
    if (!state.algos.has(algo)) continue;
    const vs = variantsOf(algo);
    const sel = variantState(algo);
    if (sel.size === 1 && sel.has(vs[0])) continue; // the default: first variant
    const tokens = sel.size === vs.length ? ["all"]
      : sel.size ? vs.filter((p) => sel.has(p)) : ["none"];
    q.set("variant." + algo, tokens.join(","));
  }

  for (const def of FACETS) {
    const sel = state.facet.get(def.key);
    if (sel.size < def.values.length) q.set(def.key, [...sel].join(","));
  }

  const status = [...availableInstances(selectedCombos())].map(([dataset, insts]) => {
    const st = instState(dataset);
    return { dataset, insts, st, picked: [...insts].filter((i) => st.picked.has(i)) };
  });
  const wholeFamilies = status.every(({ st, insts, picked }) =>
    !st.avg && (picked.length === 0 || picked.length === insts.size));
  if (wholeFamilies) {
    if (status.some(({ picked }) => picked.length === 0))
      q.set("dataset",
        status.filter(({ picked }) => picked.length).map(({ dataset }) => dataset).join(","));
  } else {
    for (const { dataset, insts, st, picked } of status) {
      if (!st.avg && picked.length === insts.size) continue;
      const tokens = picked.length === insts.size ? ["all"]
        : picked.length ? picked : ["none"];
      if (st.avg) tokens.push("mean");
      q.set("inst." + dataset, tokens.join(","));
    }
  }

  if (state.scale !== "auto") q.set("scale", state.scale);
  if (state.view !== "chart") q.set("view", state.view);

  const theme = document.documentElement.dataset.theme;
  if (theme) q.set("theme", theme);

  history.replaceState(null, "", location.pathname + "?" + q.toString());
}

/* ---------- top-level render ---------- */

function update() {
  updateView();
  reportHeight();
}

function updateView() {
  dropdowns.forEach((d) => d.refresh());
  $("scale-seg").refresh(); $("view-seg").refresh();
  const anyVariants = allAlgos().some((a) => state.algos.has(a) && variantsOf(a).length > 1);
  $("variant-field").style.display = anyVariants ? "" : "none";
  syncUrl();

  charts.forEach((c) => c.dispose());
  charts = [];
  $("cards").textContent = "";

  const runs = selectedRuns();
  const combos = selectedCombos();
  const globalMsg = !runs.length ? "No run matches the selected hardware and build."
    : !combos.length ? "Nothing selected — pick an algorithm (and at least one variant)." : null;
  $("empty-card").hidden = !globalMsg;
  $("empty").textContent = globalMsg || "";
  if (globalMsg) return;

  for (const combo of combos) {
    const slice = assemble(combo);
    const card = document.createElement("section");
    card.className = "card";
    const h2 = document.createElement("h2");
    h2.textContent = combo.algo + (combo.params ? ` — ${variantLabel(combo.params)}` : "");
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = slice.runs.length === 1 ? runLabel(slice.runs[0]) : `${slice.runs.length} runs`;
    card.append(h2, sub);
    $("cards").appendChild(card);

    const msg = !slice.ticks.length ? "No instances selected for this chart's families."
      : !slice.names.length ? "No results for this selection." : null;
    if (msg) {
      const div = document.createElement("div");
      div.className = "msg";
      div.textContent = msg;
      card.appendChild(div);
    } else if (state.view === "chart") {
      renderChart(card, slice, legendSelOf(combo));
    } else {
      renderTable(card, slice);
    }
  }
}

async function boot() {
  try {
    const resp = await fetch("data.json");
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    DATA = await resp.json();
  } catch (err) {
    $("empty-card").hidden = false;
    $("empty").innerHTML = `Could not load <code>data.json</code> (${esc(err.message)}).<br>` +
      `Generate it with <code>python export_web.py results web/data.json</code> and serve this ` +
      `directory over HTTP, e.g. <code>python -m http.server</code> in <code>web/</code>.`;
    return;
  }

  buildFacetDefs();
  indexRows();
  buildControls();
  buildSegs();
  applyUrlState();
  $("filters").hidden = false;

  const stamps = Object.values(DATA.runs).map((r) => r.timestamp).filter(Boolean).sort();
  $("foot").textContent = `${Object.keys(DATA.runs).length} run(s), ${DATA.rows.length} measurements` +
    (stamps.length ? `, latest ${stamps[stamps.length - 1].slice(0, 10)}` : "");

  update();
  addEventListener("resize", () => charts.forEach((c) => c.resize()));
  darkMode.addEventListener("change", update);
}

boot();
</script>
</body>
